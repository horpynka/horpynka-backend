name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
          NODE_ENV: production
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || 22 }}
          command_timeout: 30m
          envs: DEPLOY_PATH,DB_HOST,DB_PORT,DB_NAME,DB_USERNAME,DB_PASSWORD,POSTGRES_PASSWORD,POSTGRES_USER,POSTGRES_DB,NODE_ENV
          script_stop: true
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yaml build
            docker compose -f docker-compose.prod.yaml up -d --remove-orphans
            docker image prune -f
  autoupdate-api-sdk:
    needs: deploy
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger API SDK autoupdate
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.API_SDK_DISPATCH_TOKEN }}
          repository: horpynka/horpynka-api-sdk
          event-type: autoupdate
          client-payload: |
            {
              "ref": "main",
              "triggered_by": "${{ github.repository }}",
              "sha": "${{ github.sha }}"
            }
